<style>
:root{--bg:#dde5f2;--fg:#1b2233;--pad:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10131c;--fg:#eef1f7;--pad:#232a3d}}
:root[data-theme="dark"]{--bg:#10131c;--fg:#eef1f7;--pad:#232a3d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:ui-monospace,Menlo,Consolas,monospace}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;user-select:none;-webkit-user-select:none;touch-action:none}
canvas{width:100%;max-width:min(960px,calc((100dvh - 200px)*1.82));image-rendering:auto;border:3px solid var(--fg);background:#000;box-sizing:border-box}
#ui{display:flex;gap:28px;align-items:center;justify-content:center}
#dp{display:grid;grid-template-columns:repeat(3,50px);grid-template-rows:repeat(2,50px);gap:4px}
#dp b,#act{display:flex;align-items:center;justify-content:center;background:var(--pad);border:2px solid var(--fg);border-radius:10px;font-size:20px;cursor:pointer}
#act{width:64px;height:64px;border-radius:50%}
small{opacity:.75;text-align:center;padding:0 12px}
canvas{position:fixed;inset:0;width:100vw;height:100dvh;max-width:none;border:0}#ui{position:fixed;left:0;right:0;bottom:calc(12px + env(safe-area-inset-bottom,0px));padding:0 16px;justify-content:space-between;opacity:.8}small{display:none}#dp b,#act{background:rgba(30,36,56,.7);color:#fff;border-color:#fff}#mn{position:fixed;inset:0;z-index:9;display:flex;align-items:flex-start;justify-content:center;background:linear-gradient(#1b2a52,#0e1630);font:bold 14px monospace;color:#fff;padding:16px 12px;overflow:auto;box-sizing:border-box}#box{width:min(440px,100%);text-align:center}#box h1{font-size:26px;color:#ffd84a;text-shadow:3px 3px #000;margin:6px 0}#box button{display:block;width:100%;margin:8px 0;padding:12px;font:inherit;background:#2b5fb0;color:#fff;border:3px solid #fff;border-radius:6px}#box button:disabled{opacity:.4}#box input{width:100%;box-sizing:border-box;padding:10px;font:inherit}#box img{image-rendering:pixelated}#gr{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}#gr button{margin:0;padding:6px;font-size:11px}#emo,#mbtn,#invb{width:52px;height:52px;border-radius:50%;background:rgba(30,36,56,.7);color:#fff;border:2px solid #fff;display:flex;align-items:center;justify-content:center;font:22px sans-serif;user-select:none;touch-action:none;box-sizing:border-box}#mbtn{position:fixed;z-index:5;top:calc(8px + env(safe-area-inset-top,0px));right:8px;width:40px;height:40px;font-size:18px}
#mn{background:radial-gradient(ellipse at 25% 15%,#2a7a9a,#0d3a5c 55%,#06202f)}#box.wide{width:min(780px,100%);text-align:left}
.tt{font:900 32px "Courier New",monospace;color:#e8f6ff;text-shadow:3px 0 #123,-3px 0 #123,0 3px #123,0 -3px #123,4px 4px #0a1a2a;margin:2px 0 10px;line-height:1}
.tg{display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:10px}#box button.tl{margin:0;padding:0;background:#c9d9f0;color:#14263c;border:3px solid #eef4ff;border-radius:3px;box-shadow:0 0 0 2px #14263c;text-align:left;font-size:11px}
#box button.tl b{display:block;padding:4px 7px}#box button.tl img{width:100%;height:min(78px,13vh);object-fit:cover;display:block;border-top:3px solid #14263c}.bb{margin-top:12px;padding:8px;background:#14263c;color:#cfe3ff;font-size:11px;border-top:2px solid #5a7aa0}
#vit{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:#7b4e28;padding:8px;border-radius:6px}#box #vit .it{margin:0;padding:8px;background:#f3d9a0;color:#3b2a1a;border-color:#3b2a1a;font-size:12px}#vit .it span{font-size:30px;display:block}#vit i{color:#a02020;font-style:normal}
#joy{width:120px;height:120px;border-radius:50%;background:rgba(30,36,56,.45);border:2px solid rgba(255,255,255,.7);position:relative;touch-action:none}#joy i{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.75);pointer-events:none}#ab{display:flex;gap:12px;align-items:center}#ui{align-items:flex-end}
#rot{display:none;position:fixed;inset:0;z-index:20;background:rgba(13,27,51,.95);color:#fff;font:bold 18px monospace;align-items:center;justify-content:center;text-align:center;padding:20px;flex-direction:column;gap:14px}@media(orientation:portrait){#rot{display:flex}}#rot button{font:inherit;padding:10px 16px}
#mn{font-size:18px}#box{width:min(560px,100%)}#box.wide{width:min(980px,100%)}#box h1{font-size:34px}#box button{padding:16px;font-size:18px}#box p{margin:10px 0}
.tt{font-size:38px}#box button.tl{font-size:16px}#box button.tl b{padding:6px 10px}#box button.tl img{height:min(110px,16vh)}.bb{font-size:14px}
#gr button{font-size:14px}#gr img{width:84px;height:84px}#box img[width="112"]{width:168px;height:168px}#vit .it{font-size:15px}#vit .it span{font-size:42px}
#joy{width:160px;height:160px}#joy i{left:45px;top:45px;width:70px;height:70px}#emo,#act{width:72px!important;height:72px!important;font-size:30px!important}#mbtn,#invb{width:54px;height:54px;font-size:24px}
.cr{display:flex;align-items:center;gap:8px;margin:6px 0;background:rgba(0,0,0,.28);padding:6px 8px;border-radius:6px;flex-wrap:wrap}.cr img{image-rendering:pixelated;width:40px;height:40px}.cn{flex:1;min-width:110px;text-align:left;font-size:15px}.cn i{display:block;font-style:normal;font-size:11px;opacity:.85}.cc{font-size:28px;letter-spacing:4px;color:#ffd84a;min-width:84px;text-align:center}#box .cr button{display:inline-block;width:auto;margin:0;padding:6px 9px;font-size:12px;border-width:2px}
#box img.cv{image-rendering:auto;width:min(300px,72vw,38vh);height:auto;display:block;margin:4px auto 12px;border:3px solid #fff;border-radius:12px;box-shadow:0 4px 0 rgba(0,0,0,.4)}#invb{position:fixed;z-index:5;top:calc(8px + env(safe-area-inset-top,0px));right:70px}details{margin-top:14px}summary{cursor:pointer;padding:8px}
</style><style id=hd>
/* ===== HD / menús sin pixelar ===== */
canvas{image-rendering:auto}
body,#box,#box button,#box input{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif!important}
#box img,#box .cr img,.cm img,.vr img{image-rendering:auto!important}
#mn{background:radial-gradient(1300px 760px at 10% -5%,#47b4d4 0,#12557f 38%,#071c33 82%)!important;overflow:auto}
#mn::before{content:"";position:fixed;inset:-25%;pointer-events:none;background:repeating-linear-gradient(115deg,rgba(255,236,170,0) 0 90px,rgba(255,236,170,.11) 135px,rgba(255,236,170,0) 220px);mix-blend-mode:screen;filter:blur(7px);animation:rays 14s ease-in-out infinite alternate}
#mn::after{content:"";position:fixed;left:-10%;top:-20%;width:70vmax;height:70vmax;pointer-events:none;background:radial-gradient(closest-side,rgba(255,236,170,.35),rgba(255,214,130,.10) 45%,rgba(255,200,110,0));mix-blend-mode:screen}
@keyframes rays{from{transform:translateX(-4%) rotate(-1.2deg);opacity:.65}to{transform:translateX(5%) rotate(1.2deg);opacity:1}}
#box{position:relative;z-index:1}
#box h1{font-weight:800;letter-spacing:-.5px;text-shadow:0 3px 14px rgba(0,0,0,.45)!important}
#box button{border-radius:14px!important;border:1.5px solid rgba(255,255,255,.55)!important;background:linear-gradient(180deg,rgba(70,130,215,.9),rgba(34,78,150,.9))!important;box-shadow:0 6px 18px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.35);font-weight:700;letter-spacing:.2px;transition:transform .12s,filter .12s}
#box button:hover{filter:brightness(1.12);transform:translateY(-1px)}
#box button:active{transform:translateY(1px)}
#box button.tl{overflow:hidden;padding:0!important;background:rgba(236,245,255,.94)!important;color:#10263f;border:1px solid #fff!important;box-shadow:0 8px 22px rgba(0,0,0,.38)}
#box button.tl img{border-top:0!important;border-radius:0 0 14px 14px}
.bb{border-radius:12px;background:rgba(10,24,44,.6)!important;border-top:0!important}
#vit{background:rgba(60,40,24,.55)!important;border-radius:16px!important;backdrop-filter:blur(6px)}
#box #vit .it{border-radius:14px!important;background:linear-gradient(#f8e6b8,#f0d196)!important;color:#3b2a1a!important}
.cr{border-radius:14px!important;background:rgba(0,0,0,.3)!important}
.cr img{border-radius:10px}
/* mochila rápida */
#hb{position:fixed;z-index:6;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));display:none;gap:8px;max-width:calc(100vw - 380px);overflow-x:auto;padding:6px;background:rgba(10,20,40,.45);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.35);border-radius:16px}
.hs{position:relative;width:52px;height:52px;flex:none;border-radius:12px;background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.35);display:flex;align-items:center;justify-content:center;font-size:28px;cursor:pointer;user-select:none}
.hs.on{border-color:#ffd84a;box-shadow:0 0 14px rgba(255,216,74,.7);background:rgba(255,216,74,.2)}
.hs em{position:absolute;right:4px;bottom:1px;font:700 12px system-ui;color:#fff;text-shadow:0 1px 2px #000;font-style:normal}
.hs i{position:absolute;left:5px;top:1px;font:700 10px system-ui;color:#fde68a;font-style:normal}
/* botones de juego */
#chb,#mic,#vcb{position:fixed;z-index:5;top:calc(8px + env(safe-area-inset-top,0px));width:54px;height:54px;border-radius:50%;background:rgba(30,36,56,.7);color:#fff;border:2px solid #fff;display:none;align-items:center;justify-content:center;font:24px sans-serif;user-select:none;touch-action:none;box-sizing:border-box;cursor:pointer}
#chb,#mic,#vcb{right:8px}#chb{top:calc(72px + env(safe-area-inset-top,0px))}#vcb{top:calc(134px + env(safe-area-inset-top,0px))}#mic{top:calc(196px + env(safe-area-inset-top,0px))}
#vcb.on{border-color:#4ade80;box-shadow:0 0 14px #4ade80;background:rgba(20,80,50,.8)}
#vcb[data-n]::after{content:attr(data-n);position:absolute;right:-4px;top:-4px;min-width:20px;height:20px;border-radius:10px;background:#16a34a;color:#fff;font:700 12px system-ui;display:flex;align-items:center;justify-content:center;padding:0 4px;box-sizing:border-box}
#chb[data-n]::after{content:attr(data-n);position:absolute;right:-4px;top:-4px;min-width:20px;height:20px;border-radius:10px;background:#e53e3e;color:#fff;font:700 12px system-ui;display:flex;align-items:center;justify-content:center;padding:0 4px;box-sizing:border-box}
/* chat */
#chl{height:min(44vh,320px);overflow:auto;background:rgba(0,0,0,.28);border-radius:16px;padding:8px;text-align:left;margin:8px 0}
.cm{display:flex;gap:8px;margin:6px 0;align-items:flex-start}
.cm img{width:34px;height:34px;border-radius:9px;flex:none}
.cm>div{background:rgba(255,255,255,.14);border-radius:12px;padding:6px 10px;text-align:left;max-width:78%;word-break:break-word;font-size:15px}
.cm.me{flex-direction:row-reverse}.cm.me>div{background:rgba(74,160,255,.42)}
.cm time{opacity:.6;font-size:11px;margin-left:8px}
#chf{display:flex;gap:8px;align-items:stretch}#chf input{flex:1;border-radius:14px;border:2px solid #fff;background:rgba(255,255,255,.95);font-size:16px}
#box #chf button{width:auto;margin:0;padding:0 22px}
/* voz */
.vr{display:flex;align-items:center;gap:10px;background:rgba(0,0,0,.3);border-radius:14px;padding:6px 10px;margin:6px 0;transition:box-shadow .15s}
.vr img{width:40px;height:40px;border-radius:10px}.vr span{flex:1;text-align:left}
.vr.sp{box-shadow:0 0 0 3px #4ade80,0 0 18px #4ade80}
#box .vr button{width:auto;margin:0;padding:6px 10px;font-size:16px}

/* chat global: admins y moderación */
.cm.ad>div{background:rgba(255,216,74,.22)!important;box-shadow:inset 0 0 0 1px rgba(255,216,74,.7)}
.bd{font-style:normal;font-size:10px;font-weight:800;background:#ffd84a;color:#3a2a00;border-radius:6px;padding:1px 6px;margin-left:6px;letter-spacing:.4px}
.mod{float:right;margin-left:10px}
#box .mod button{display:inline-block;width:auto;margin:0 0 0 4px;padding:2px 8px;font-size:14px;border-width:1px!important;border-radius:8px!important;box-shadow:none}
#chs{min-height:1.2em;margin:4px 0;font-size:15px}
#box details button{margin:8px 0}
/* barra de voz del menú y franja del juego */
#vbar{margin-top:14px;padding:12px 14px;border-radius:16px;background:rgba(8,18,40,.5);border:1px solid rgba(255,255,255,.3);backdrop-filter:blur(6px)}
#vbar .vt{font-weight:700;margin-bottom:6px}.ve{font-style:normal;font-size:14px;color:#fde68a}
.vav,#vstrip{display:flex;flex-wrap:wrap;gap:8px}
.vav{margin:6px 0 10px}
.vav img,#vstrip img{width:38px;height:38px;border-radius:50%;object-fit:cover;border:3px solid rgba(255,255,255,.55);background:#222;transition:box-shadow .12s,border-color .12s}
.vav img.sp,#vstrip img.sp{border-color:#4ade80;box-shadow:0 0 0 3px rgba(74,222,128,.45),0 0 16px #4ade80}
#vbar button{margin:0!important}
#vbar .vb2{display:flex;gap:8px}#vbar .vb2 button{flex:1}
#vstrip{position:fixed;z-index:5;left:16px;top:calc(76px + env(safe-area-inset-top,0px));display:none;max-width:min(60vw,420px);pointer-events:none}
#vstrip img{width:32px;height:32px;border-width:2px}
</style></head><body>

<script>// Conecta el juego con el servidor propio (reemplaza a window.claude: user, db y room).
(function () {
  const g = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
  const st = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
  let sec = g('mc6sec');
  if (!/^[0-9a-f]{32}$/.test(sec || '')) {
    sec = [...crypto.getRandomValues(new Uint8Array(16))].map(b => b.toString(16).padStart(2, '0')).join('');
    st('mc6sec', sec);
  }
  let ws, ready = false, uid = null, adm = false, me = null, rid = 0, sid = 0, tries = 0, hiOnce = false, failedFirst = false;
  const pend = {}, subs = {}, peers = {}, pcb = [], myPres = {};
  let hiRes, hiRej;
  const hiP = new Promise((a, b) => { hiRes = a; hiRej = b; });
  hiP.catch(() => {});
  setTimeout(() => { if (!hiOnce) { failedFirst = true; hiRej(new Error('timeout')); } }, 8000);

  const base = () => (window.MC_SERVER || location.origin).replace(/\/+$/, '').replace(/^http/, 'ws');
  const send = o => { if (ws && ws.readyState === 1) ws.send(JSON.stringify(o)); };
  const req = o => new Promise((res, rej) => {
    if (!ready) return rej(new Error('offline'));
    const id = ++rid; pend[id] = { res, rej };
    send(Object.assign({}, o, { rid: id }));
    setTimeout(() => { if (pend[id]) { delete pend[id]; rej(new Error('timeout')); } }, 10000);
  });
  const firePeers = () => pcb.forEach(f => { try { f(); } catch (e) {} });

  function connect() {
    try { ws = new WebSocket(base() + '/ws?s=' + sec + '&k=' + encodeURIComponent(g('mc6adm') || '')); }
    catch (e) { setTimeout(connect, 3000); return; }
    ws.onmessage = ev => {
      let m; try { m = JSON.parse(ev.data); } catch (e) { return; }
      if (m.t === 'hi') {
        uid = m.uid; adm = !!m.adm; me = m.peer; ready = true; tries = 0;
        for (const id in subs) send(Object.assign({ t: 'sub', id: +id }, subs[id].q));
        if (Object.keys(myPres).length) send({ t: 'pres', p: myPres });
        if (!hiOnce) { hiOnce = true; hiRes(); }
        else if (failedFirst) { const mn = document.getElementById('mn'); if (mn && getComputedStyle(mn).display !== 'none') location.reload(); }
      } else if (m.t === 'snap') {
        const s = subs[m.id]; if (!s) return;
        if (m.err) { if (s.er) s.er(new Error(m.err)); return; }
        if (m.docs) s.cb({ docs: m.docs.map(d => ({ id: d.id, data: () => d.data })), size: m.docs.length });
        else s.cb({ exists: m.data != null, data: () => (m.data == null ? undefined : m.data) });
      } else if (m.t === 'ack') {
        const p = pend[m.rid]; if (p) { delete pend[m.rid]; m.ok ? p.res(m.d) : p.rej(new Error(m.err || 'error')); }
      } else if (m.t === 'pr') {
        for (const k in m.u) { if (m.u[k] === null) delete peers[k]; else peers[k] = m.u[k]; }
        firePeers();
      }
    };
    ws.onclose = () => {
      const was = ready; ready = false;
      for (const k in pend) { pend[k].rej(new Error('offline')); delete pend[k]; }
      for (const k in peers) delete peers[k];
      if (was) firePeers();
      setTimeout(connect, Math.min(8000, 600 * (++tries)));
    };
    ws.onerror = () => {};
  }
  connect();

  function sub(q, cb, er) {
    const id = ++sid; subs[id] = { q, cb, er };
    send(Object.assign({ t: 'sub', id }, q));
    return () => { delete subs[id]; send({ t: 'unsub', id }); };
  }
  const D = {
    collection: c => ({ onSnapshot: (cb, er) => sub({ col: c }, cb, er) }),
    doc: p => ({
      onSnapshot: (cb, er) => sub({ path: p }, cb, er),
      set: d => req({ t: 'set', path: p, data: d }).then(() => {}),
      delete: () => req({ t: 'del', path: p }).then(() => {}),
      get: () => req({ t: 'get', path: p }).then(d => ({ exists: d != null, data: () => (d == null ? undefined : d) }))
    })
  };
  const U = { id: async () => uid, canEdit: async () => adm };
  const R = {
    presence: p => { Object.assign(myPres, p); send({ t: 'pres', p }); },
    peers: () => Object.keys(peers).map(k => ({ peer: k, presence: peers[k].p, by: peers[k].by, isMe: false })),
    onPeers: cb => { pcb.push(cb); },
    connected: () => ready
  };
  window.claude = {
    use: async n => { await hiP; return n === 'user' ? U : n === 'db' ? D : n === 'room' ? R : null; },
    verify: code => req({ t: 'verify', code }).then(r => (r && r.n) || null),
    adminLogin: k => req({ t: 'adm', k }).then(ok => { if (ok) st('mc6adm', k); return !!ok; })
  };
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('/sw.js').catch(() => {});
})();
</script>

function kickBall(p,type){

 if(type==='sh'){ang=Math.atan2(PH/2+(Math.abs(fy)>.3?fy*GH*.45:0)-p.y,gx-p.x);pow=17}
 else{let best=null,bs=-1e9;for(const m of sim.pl){if(m.t!==p.t||m===p)continue;const dx=m.x-p.x,dy=m.y-p.y,d=Math.hypot(dx,dy)||1,dot=(dx*fx+dy*fy)/d,s=dot*300-d*.15;if(dot>.2&&s>bs){bs=s;best=m}}

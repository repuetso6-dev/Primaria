<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>6to Primaria</title>
<link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#0d3a5c">
<style>
:root{--bg:#dde5f2;--fg:#1b2233;--pad:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10131c;--fg:#eef1f7;--pad:#232a3d}}
:root[data-theme="dark"]{--bg:#10131c;--fg:#eef1f7;--pad:#232a3d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:ui-monospace,Menlo,Consolas,monospace}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;user-select:none;-webkit-user-select:none;touch-action:none}
canvas{width:100%;max-width:min(960px,calc((100dvh - 200px)*1.82));image-rendering:pixelated;border:3px solid var(--fg);background:#000;box-sizing:border-box}
#ui{display:flex;gap:28px;align-items:center;justify-content:center}
#dp{display:grid;grid-template-columns:repeat(3,50px);grid-template-rows:repeat(2,50px);gap:4px}
#dp b,#act{display:flex;align-items:center;justify-content:center;background:var(--pad);border:2px solid var(--fg);border-radius:10px;font-size:20px;cursor:pointer}
#act{width:64px;height:64px;border-radius:50%}
small{opacity:.75;text-align:center;padding:0 12px}
canvas{position:fixed;inset:0;width:100vw;height:100dvh;max-width:none;border:0}#ui{position:fixed;left:0;right:0;bottom:calc(12px + env(safe-area-inset-bottom,0px));padding:0 16px;justify-content:space-between;opacity:.8}small{display:none}#dp b,#act{background:rgba(30,36,56,.7);color:#fff;border-color:#fff}#mn{position:fixed;inset:0;z-index:9;display:flex;align-items:flex-start;justify-content:center;background:linear-gradient(#1b2a52,#0e1630);font:bold 14px monospace;color:#fff;padding:16px 12px;overflow:auto;box-sizing:border-box}#box{width:min(440px,100%);text-align:center}#box h1{font-size:26px;color:#ffd84a;text-shadow:3px 3px #000;margin:6px 0}#box button{display:block;width:100%;margin:8px 0;padding:12px;font:inherit;background:#2b5fb0;color:#fff;border:3px solid #fff;border-radius:6px}#box button:disabled{opacity:.4}#box input{width:100%;box-sizing:border-box;padding:10px;font:inherit}#box img{image-rendering:pixelated}#gr{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}#gr button{margin:0;padding:6px;font-size:11px}#emo,#mbtn{width:52px;height:52px;border-radius:50%;background:rgba(30,36,56,.7);color:#fff;border:2px solid #fff;display:flex;align-items:center;justify-content:center;font:22px sans-serif;user-select:none;touch-action:none;box-sizing:border-box}#mbtn{position:fixed;z-index:5;top:calc(8px + env(safe-area-inset-top,0px));right:8px;width:40px;height:40px;font-size:18px}
#mn{background:radial-gradient(ellipse at 25% 15%,#2a7a9a,#0d3a5c 55%,#06202f)}#box.wide{width:min(780px,100%);text-align:left}
.tt{font:900 32px "Courier New",monospace;color:#e8f6ff;text-shadow:3px 0 #123,-3px 0 #123,0 3px #123,0 -3px #123,4px 4px #0a1a2a;margin:2px 0 10px;line-height:1}
.tg{display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:10px}#box button.tl{margin:0;padding:0;background:#c9d9f0;color:#14263c;border:3px solid #eef4ff;border-radius:3px;box-shadow:0 0 0 2px #14263c;text-align:left;font-size:11px}
#box button.tl b{display:block;padding:4px 7px}#box button.tl img{width:100%;height:min(78px,13vh);object-fit:cover;display:block;border-top:3px solid #14263c}.bb{margin-top:12px;padding:8px;background:#14263c;color:#cfe3ff;font-size:11px;border-top:2px solid #5a7aa0}
#vit{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:#7b4e28;padding:8px;border-radius:6px}#box #vit .it{margin:0;padding:8px;background:#f3d9a0;color:#3b2a1a;border-color:#3b2a1a;font-size:12px}#vit .it span{font-size:30px;display:block}#vit i{color:#a02020;font-style:normal}
#joy{width:120px;height:120px;border-radius:50%;background:rgba(30,36,56,.45);border:2px solid rgba(255,255,255,.7);position:relative;touch-action:none}#joy i{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.75);pointer-events:none}#ab{display:flex;gap:12px;align-items:center}#ui{align-items:flex-end}
#rot{display:none;position:fixed;inset:0;z-index:20;background:rgba(13,27,51,.95);color:#fff;font:bold 18px monospace;align-items:center;justify-content:center;text-align:center;padding:20px;flex-direction:column;gap:14px}@media(orientation:portrait){#rot{display:flex}}#rot button{font:inherit;padding:10px 16px}
#mn{font-size:18px}#box{width:min(560px,100%)}#box.wide{width:min(980px,100%)}#box h1{font-size:34px}#box button{padding:16px;font-size:18px}#box p{margin:10px 0}
.tt{font-size:38px}#box button.tl{font-size:16px}#box button.tl b{padding:6px 10px}#box button.tl img{height:min(110px,16vh)}.bb{font-size:14px}
#gr button{font-size:14px}#gr img{width:84px;height:84px}#box img[width="112"]{width:168px;height:168px}#vit .it{font-size:15px}#vit .it span{font-size:42px}
#joy{width:160px;height:160px}#joy i{left:45px;top:45px;width:70px;height:70px}#emo,#act{width:72px!important;height:72px!important;font-size:30px!important}#mbtn{width:54px;height:54px;font-size:24px}
.cr{display:flex;align-items:center;gap:8px;margin:6px 0;background:rgba(0,0,0,.28);padding:6px 8px;border-radius:6px;flex-wrap:wrap}.cr img{image-rendering:pixelated;width:40px;height:40px}.cn{flex:1;min-width:110px;text-align:left;font-size:15px}.cn i{display:block;font-style:normal;font-size:11px;opacity:.85}.cc{font-size:28px;letter-spacing:4px;color:#ffd84a;min-width:84px;text-align:center}#box .cr button{display:inline-block;width:auto;margin:0;padding:6px 9px;font-size:12px;border-width:2px}
#box img.cv{image-rendering:auto;width:min(300px,72vw,38vh);height:auto;display:block;margin:4px auto 12px;border:3px solid #fff;border-radius:12px;box-shadow:0 4px 0 rgba(0,0,0,.4)}details{margin-top:14px}summary{cursor:pointer;padding:8px}
</style></head><body>

<script>// Conecta el juego con el servidor propio (reemplaza a window.claude: user, db y room).
(function () {
  const g = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
  const st = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
  let sec = g('mc6sec');
  if (!/^[0-9a-f]{32}$/.test(sec || '')) {
    sec = [...crypto.getRandomValues(new Uint8Array(16))].map(b => b.toString(16).padStart(2, '0')).join('');
    st('mc6sec', sec);
  }
  let ws, ready = false, uid = null, adm = false, me = null, rid = 0, sid = 0, tries = 0, hiOnce = false, failedFirst = false;
  const pend = {}, subs = {}, peers = {}, pcb = [], myPres = {};
  let hiRes, hiRej;
  const hiP = new Promise((a, b) => { hiRes = a; hiRej = b; });
  hiP.catch(() => {});
  setTimeout(() => { if (!hiOnce) { failedFirst = true; hiRej(new Error('timeout')); } }, 8000);

  const base = () => (window.MC_SERVER || location.origin).replace(/\/+$/, '').replace(/^http/, 'ws');
  const send = o => { if (ws && ws.readyState === 1) ws.send(JSON.stringify(o)); };
  const req = o => new Promise((res, rej) => {
    if (!ready) return rej(new Error('offline'));
    const id = ++rid; pend[id] = { res, rej };
    send(Object.assign({}, o, { rid: id }));
    setTimeout(() => { if (pend[id]) { delete pend[id]; rej(new Error('timeout')); } }, 10000);
  });
  const firePeers = () => pcb.forEach(f => { try { f(); } catch (e) {} });

  function connect() {
    try { ws = new WebSocket(base() + '/ws?s=' + sec + '&k=' + encodeURIComponent(g('mc6adm') || '')); }
    catch (e) { setTimeout(connect, 3000); return; }
    ws.onmessage = ev => {
      let m; try { m = JSON.parse(ev.data); } catch (e) { return; }
      if (m.t === 'hi') {
        uid = m.uid; adm = !!m.adm; me = m.peer; ready = true; tries = 0;
        for (const id in subs) send(Object.assign({ t: 'sub', id: +id }, subs[id].q));

 for(let py=0;py<64;py++)for(let px=0;px<64;px++){const u=(px+py)%64,v=(px-py+64)%64,bu=u>>4,bv=v>>4,lu=u&15,lv=v&15;let gr,id;
